<!-- MODAL PRODUTOS -->

<div id="produtos-panel" class="usuarios-modal" style="display:none;">


    <div class="dashboard-card usuarios-box">



        <div class="card-header">


            <h4>
                Gestão de Produtos
            </h4>




            <button
                class="btn btn-danger"
                onclick="fecharProdutos()">



                <i class="bi bi-x-lg"></i>



            </button>



        </div>






        <button
            class="btn btn-primary mb-3"
            onclick="mostrarFormularioProduto()">



            <i class="bi bi-plus"></i>


            Novo Produto



        </button>







        <!-- FORMULÁRIO PRODUTO -->

        <div id="form-produto" style="display:none;">





            <input
                id="produto-id"
                type="hidden">






            <select
                id="produto-categoria"
                class="form-control mb-2">


                <option value="">
                    Selecione a categoria
                </option>



            </select>







            <input
                id="produto-nome"
                class="form-control mb-2"
                placeholder="Nome do produto">







            <textarea
                id="produto-descricao"
                class="form-control mb-2"
                placeholder="Descrição">
            </textarea>







            <input
                id="produto-compra"
                type="number"
                step="0.01"
                class="form-control mb-2"
                placeholder="Preço de compra">







            <input
                id="produto-venda"
                type="number"
                step="0.01"
                class="form-control mb-2"
                placeholder="Preço de venda">







            <input
                id="produto-quantidade"
                type="number"
                class="form-control mb-2"
                placeholder="Quantidade">







            <input
                id="produto-minimo"
                type="number"
                class="form-control mb-2"
                placeholder="Stock mínimo">







            <input
                id="produto-unidade"
                class="form-control mb-3"
                placeholder="Unidade"
                value="unidade">







            <div class="d-flex gap-2">





                <button
                    class="btn btn-success"
                    onclick="salvarProduto()">



                    <i class="bi bi-check-lg"></i>


                    Salvar



                </button>







                <button
                    class="btn btn-secondary"
                    onclick="fecharFormularioProduto()">



                    Cancelar



                </button>





            </div>





        </div>







        <hr>








        <!-- TABELA PRODUTOS -->




        <div style="overflow-x:auto;">





            <table class="table table-hover">





                <thead>





                    <tr>





                        <th>
                            ID
                        </th>




                        <th>
                            Categoria ID
                        </th>




                        <th>
                            Nome
                        </th>




                        <th>
                            Descrição
                        </th>




                        <th>
                            Preço Compra
                        </th>




                        <th>
                            Preço Venda
                        </th>




                        <th>
                            Quantidade
                        </th>




                        <th>
                            Stock Mínimo
                        </th>




                        <th>
                            Unidade
                        </th>




                        <th>
                            Estado
                        </th>




                        <th>
                            Criado Em
                        </th>




                        <th>
                            Ações
                        </th>





                    </tr>





                </thead>






                <tbody id="lista-produtos">





                </tbody>







            </table>






        </div>







    </div>






</div>
