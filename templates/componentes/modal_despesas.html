<div
id="modal-despesas"
class="modal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.5);
z-index:9999;
align-items:center;
justify-content:center;
">


<div
style="
background:white;
padding:20px;
width:850px;
border-radius:10px;
max-height:85%;
overflow:auto;
">


<div class="d-flex justify-content-between">

<h4>
Gestão de Despesas
</h4>


<button
class="btn btn-danger"
onclick="fecharDespesas()">
X
</button>

</div>


<hr>



<!-- BOTÃO NOVA DESPESA -->

<button
id="btn-nova-despesa"
class="btn btn-primary mb-3"
onclick="abrirFormularioDespesa()">

<i class="bi bi-plus"></i>

Nova despesa

</button>




<!-- FORMULÁRIO -->

<div
id="formulario-despesa"
style="display:none;">


<div class="mb-2">

<label>
Descrição
</label>

<input
id="despesa-descricao"
class="form-control"
placeholder="Ex: Compra de gelo">


</div>




<div class="mb-2">

<label>
Categoria
</label>

<input
id="despesa-categoria"
class="form-control"
placeholder="Ex: Fornecedor">


</div>




<div class="mb-2">

<label>
Valor proposto
</label>

<input
type="number"
step="0.01"
id="despesa-valor"
class="form-control"
placeholder="0.00">


</div>





<div class="mb-2">

<label>
Observação
</label>

<textarea
id="despesa-observacao"
class="form-control"
placeholder="Detalhes da despesa">
</textarea>


</div>



<button
class="btn btn-success"
onclick="salvarDespesa()">

Enviar pedido

</button>


</div>



<hr>



<!-- TABELA DAS DESPESAS -->


<h5>
Lista de despesas
</h5>


<div id="lista-despesas">

</div>



</div>


</div>
